name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # 轻量离线job：零重依赖（仅 numpy），秒级完成——语法检查 + 全 mock 单测
  offline:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装最小依赖
        run: pip install numpy
      - name: 语法检查（全部脚本）
        run: python -m py_compile av_to_transcript_and_minutes.py test_pipeline_e2e.py benchmark_quality.py scripts/make_fixtures.py tests/test_quality_baseline.py tests/test_tools_units.py tests/test_mcp_e2e.py tools/*.py skills/funasr-transcribe/scripts/*.py
      - name: tools 工具单测（清单/MCP 参数/索引/泳道图，零依赖）
        run: python tests/test_tools_units.py
      - name: ITN 单测（零依赖）
        run: python skills/funasr-transcribe/scripts/test_itn_zh.py
      - name: cloud 引擎单测（全 mock，零网络）
        run: python skills/funasr-transcribe/scripts/test_cloud_units.py
      - name: 缓存源指纹单测（零依赖）
        run: python skills/funasr-transcribe/scripts/test_cache_fingerprint.py
      - name: 超长段切分与声纹质心单测（零依赖，仅 numpy）
        run: python skills/funasr-transcribe/scripts/test_split_and_cluster.py
      - name: VAD 自动选择 / 字幕硬切 / 阅读速度 / RTTM / 发言概览单测（零依赖）
        run: python skills/funasr-transcribe/scripts/test_v25_upgrade_units.py
      - name: pyannote 分块与重叠区间单测（无 pyannote 时自动跳过）
        run: python skills/funasr-transcribe/scripts/test_pyannote_chunking.py
      - name: 基准脚本自检（CER/编辑距离；DER 需 pyannote.metrics，缺则跳过）
        run: python benchmark_quality.py --selftest
      - name: 技能双副本同步工具自检（零依赖，不碰本机用户目录）
        run: python scripts/check_skill_sync.py --selftest

  # 纪要技能job：装 python-docx + jsonschema，跑本仓纪要工具自检。
  # 2026-10-22 新增——此前 meeting-notes-expert 的脚本完全不在 CI 覆盖面内，
  # 其 docx 校验缺陷（只认字面 ##）因此长期未被发现。
  # 2026-11-22：技能已拆为独立私有仓库（ADC1920/meeting-notes-expert），本仓不再携带副本。
  # 技能自身的 selftest 不在本仓 CI 里跑——它在独立仓库自己的 CI 跑更合适；
  # 本 job 只验证「本仓工具在技能缺席时能正常运行」这一件事，那才是本仓的责任边界。
  skill-minutes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装本仓工具依赖（仅 python-docx）
        run: pip install python-docx
      - name: 纪要导出与校验工具自检
        run: python tools/minutes_quality.py --selftest
      - name: 纪要质量评测基准自检
        run: python tools/minutes_eval.py --selftest

  # MCP 契约job：装 mcp SDK，真起 stdio 子进程走 JSON-RPC 握手。
  # 只在装了 SDK 的环境验——主 job 里那 5 组 MCP 用例会 SKIP，
  # 协议层契约（outputSchema/annotations/resources 能否被客户端看见）只有这里能证明。
  #
  # 1.x 与 2.x 都要跑：2.x 把 FastMCP 改名 MCPServer、字段从 camelCase 改 snake_case，
  # 2026-11-26 首次推送时就是因为只在本机 1.29 验过、CI 装到 2.3 才暴露的。
  # 以后任一大版本再变，这个 matrix 会立刻抓到。
  mcp-e2e:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        mcp-version: ["mcp>=1.0,<2.0", "mcp>=2.0,<3.0"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装 MCP SDK（${{ matrix.mcp-version }}）
        run: pip install "${{ matrix.mcp-version }}"
      - name: MCP stdio 握手与工具调用
        run: python tests/test_mcp_e2e.py

  # 引擎单测job：装 funasr（Linux 上自动带 CPU torch）+ soundfile，跑 51 项纯函数单测
  engine-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装引擎依赖（funasr + 音频 IO）
        run: pip install numpy soundfile funasr
      - name: 引擎单元测试（切句/时间戳/碎段合并/字幕细分/词典合并等）
        run: python skills/funasr-transcribe/scripts/test_qwen_asr_units.py

  # 质量基线：DER/CER/重叠检测。需要 Windows TTS 造素材 + GPU 跑模型，
  # Linux runner 上 make_fixtures 会自己识别环境并跳过（退出码 0），
  # 所以本 job 在 CI 里的作用是"入口存在且脚本可导入"，真正的质量门槛在本机跑。
  # 需要 CI 也验质量时，改成自托管 Windows runner 并预先放好 fixtures。
  quality-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 素材生成脚本环境自检（非 Windows 应报告不可用且不失败）
        run: python scripts/make_fixtures.py --check
      - name: 质量基线（缺素材自动跳过，不判失败）
        run: python tests/test_quality_baseline.py --no-generate
